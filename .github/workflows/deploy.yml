name: Deploy CGPA site

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # or './your-folder' if your index.html is in a subfolder
      
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4# This is a basic workflow to help you get started with Actions
      
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v
